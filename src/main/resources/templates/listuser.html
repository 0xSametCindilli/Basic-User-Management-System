<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User List</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .container {
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.25);
            padding: 30px 40px;
            width: 800px;
            max-width: 90%;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h3 {
            margin: 0;
            font-size: 24px;
            color: #333333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #4a90e2;
            color: #ffffff;
            font-weight: bold;
            text-align: left;
            padding: 14px 16px;
        }

        thead th:first-child {
            border-top-left-radius: 12px;
        }

        thead th:last-child {
            border-top-right-radius: 12px;
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #333333;
        }

        tbody tr:hover {
            background: #f5f9ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        #adduser {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 10px;
            background: #4a90e2;
        }

        #adduser:hover {
            background: #357abd;
        }

        .btn-update {
            background: #f5a623;
        }

        .btn-update:hover {
            background: #d98f12;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h3>User List</h3>
        <a th:href="@{/adduser}" id="adduser" class="btn">Add User</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.email}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/updateuser(id=${user.id})}" class="btn btn-update">Update</a>
                    <a th:href="@{/deleteuser(id=${user.id})}" class="btn btn-delete"
                       onclick="return confirm('Bu Kullanıcı Silinsin mi?')">Delete</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
